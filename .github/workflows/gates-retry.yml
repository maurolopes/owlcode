# (The owner's call, 2026-11-08) A run of `gates` that failed only in a setup step (a download that failed: the
# mise binary, an action, apt) runs its failed jobs again, once, with no person. Only the owner could rerun a failed
# job (the apps have no "Actions: write"); this workflow uses its own token, which has no key of the
# apps. The rule is .github/gates_retry.py: a failed gate step, or any step it does not name, is never rerun. Attempt 1
# only: a second failure is the owner's, as before. The rerun is attempt 2, so `verdict-rerun` gives the check
# `verdict` back from the approve when it passes. A `workflow_run` workflow runs from main's copy, and the script is
# main's: a pull request cannot change the rule that reruns its own gates. A rerun keeps its run's concurrency group, so a
# `pull_request` run is rerun only while its head is still an open pull request's head: else the rerun of an outdated
# head would cancel the gates of the new one. A run that GitHub failed at startup has no job: the whole
# run runs again, once, on the same terms; when gates-retry fails at startup too, the review watchdog's next pass reruns it.
# (The owner's call, 2026-11-16) A `web` job that failed in the browser suite with no test failed after its retry
# (a flaky test, a test that did not run, an error outside a test) runs again once too. The suite's counts are the file
# run.json in the run's artifact `flakes-1`; without it the job stays red. The workflow `flakes` files the flake from the
# same artifact.
name: gates-retry

on:
  workflow_run:
    workflows: [gates]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest  # a short job: GitHub's runner starts in seconds
    timeout-minutes: 5
    permissions:
      actions: write  # reruns the failed jobs, and downloads the suite's counts
      contents: read
      pull-requests: read  # lists the open pull requests of the run's branch; the repository is private
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT: ${{ github.event.workflow_run.event }}
      HEAD: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}  # main's code only
      - name: Rerun the failed jobs when each one failed in a setup step or with only flaky tests, or the run when it has no job
        run: bash .github/gates-retry-run.sh
